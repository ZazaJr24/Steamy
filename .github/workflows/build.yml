name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.2.2)'
        required: true
        type: string
        default: '0.7.1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test and build the checked-in Steamy DepotDownloaderMod fork
        run: python tools/DepotDownloaderMod/build.py

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "v=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release version
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.v }}'
          foreach ($path in @('src/Steamy/Steamy.csproj', 'src/PlayTimeTracker/PlayTimeTracker.csproj')) {
            [xml]$project = Get-Content $path
            foreach ($field in @('Version', 'FileVersion', 'AssemblyVersion')) {
              if ($project.Project.PropertyGroup.$field -ne $version) { throw "Release version must match $path $field" }
            }
          }

      - name: Test release commit
        env:
          STEAMY_UI_ARTIFACTS: ${{ github.workspace }}/artifacts/ui
          STEAMY_UI_LIBRARY_INSTALL_OFFSCREEN_ONLY: '1'
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test Steamy.sln -c Release --logger trx --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Steamy-release-test-evidence
          path: |
            artifacts/test-results/
            artifacts/ui/
          if-no-files-found: error

      - name: Package portable app and small download installer
        shell: pwsh
        run: |
          ./scripts/package-distribution.ps1 -OutputDirectory distribution
          Copy-Item distribution/Steamy-*.zip, distribution/Steamy-v*-Setup.exe .
          $checks = Join-Path $pwd 'distribution/installer-checks.txt'
          $process = Start-Process -FilePath distribution/Steamy-Setup.exe -ArgumentList @('--self-test', $checks) -WindowStyle Hidden -Wait -PassThru
          Get-Content $checks
          if ($process.ExitCode -ne 0) { throw 'Installer checks failed.' }
          $uiChecks = Join-Path $pwd 'distribution/installer-ui-checks.txt'
          $process = Start-Process -FilePath distribution/Steamy-Setup.exe -ArgumentList @('--ui-test', $uiChecks) -WindowStyle Hidden -Wait -PassThru
          Get-Content $uiChecks
          if ($process.ExitCode -ne 0) { throw 'Installer interface checks failed.' }

      - name: Release notes and SHA-256 from the packaged ZIP
        run: python scripts/release_notes.py --version '${{ steps.ver.outputs.v }}' --archive 'Steamy-v${{ steps.ver.outputs.v }}.zip' --output release-notes.md

      - name: Remove the old separate downloader asset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.ver.outputs.v }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $tag = "v$env:RELEASE_VERSION"
          $releaseUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          try {
            $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -eq 404) {
              Write-Host 'No existing release to clean up.'
              exit 0
            }
            throw
          }
          $oldAssetName = "DepotDownloaderMod-$tag-win-x64.zip"
          $oldAsset = $release.assets | Where-Object name -EQ $oldAssetName | Select-Object -First 1
          if ($null -ne $oldAsset) {
            Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($oldAsset.id)" -Headers $headers
            Write-Host "Removed obsolete standalone asset $oldAssetName"
          }

      - name: Preserve already published release files
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.ver.outputs.v }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v$env:RELEASE_VERSION"
          try {
            $release = Invoke-RestMethod -Uri $url -Headers $headers
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
            $release = $null
          }
          $published = $null -ne $release -and -not $release.draft -and $null -ne $release.published_at
          "published=$($published.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($published) { Write-Host 'Published release retained. Its download files and update checksums will not be replaced by this build.' }

      - name: Create Release
        if: steps.existing.outputs.published != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Steamy v${{ steps.ver.outputs.v }}
          make_latest: true
          files: |
            Steamy-v${{ steps.ver.outputs.v }}.zip
            Steamy-v${{ steps.ver.outputs.v }}-app.zip
            Steamy-v${{ steps.ver.outputs.v }}-Setup.exe
          body_path: release-notes.md

      - name: Publish verified update metadata after the release exists
        if: steps.existing.outputs.published != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_update_manifest.py --version '${{ steps.ver.outputs.v }}' --archive 'Steamy-v${{ steps.ver.outputs.v }}.zip' --app-archive 'Steamy-v${{ steps.ver.outputs.v }}-app.zip'
