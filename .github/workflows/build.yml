name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.2.2)'
        required: true
        default: '0.6.4.2'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test and build the checked-in Steamy DepotDownloaderMod fork
        run: python tools/DepotDownloaderMod/build.py

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "v=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Steamy/Steamy.csproj
          $version = '${{ steps.ver.outputs.v }}'
          foreach ($field in @('Version', 'FileVersion', 'AssemblyVersion')) {
            if ($project.Project.PropertyGroup.$field -ne $version) { throw "Release version must match project $field" }
          }

      - name: Test release commit
        env:
          STEAMY_UI_ARTIFACTS: ${{ github.workspace }}/artifacts/ui
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test Steamy.sln -c Release --logger trx --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Steamy-release-test-evidence
          path: |
            artifacts/test-results/
            artifacts/ui/
          if-no-files-found: error

      - name: Publish self-contained
        run: |
          dotnet publish src/Steamy/Steamy.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.ver.outputs.v }} `
            -o publish

      - name: Add license files
        run: Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish/

      - name: Zip release
        run: |
          Compress-Archive -Path publish/* -DestinationPath Steamy-v${{ steps.ver.outputs.v }}.zip

      - name: Release notes and SHA-256 from the packaged ZIP
        run: python scripts/release_notes.py --version '${{ steps.ver.outputs.v }}' --archive 'Steamy-v${{ steps.ver.outputs.v }}.zip' --output release-notes.md

      - name: Remove the old separate downloader asset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.ver.outputs.v }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $tag = "v$env:RELEASE_VERSION"
          $releaseUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          try {
            $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -eq 404) {
              Write-Host 'No existing release to clean up.'
              exit 0
            }
            throw
          }
          $oldAssetName = "DepotDownloaderMod-$tag-win-x64.zip"
          $oldAsset = $release.assets | Where-Object name -EQ $oldAssetName | Select-Object -First 1
          if ($null -ne $oldAsset) {
            Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($oldAsset.id)" -Headers $headers
            Write-Host "Removed obsolete standalone asset $oldAssetName"
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Steamy v${{ steps.ver.outputs.v }}
          make_latest: true
          files: |
            Steamy-v${{ steps.ver.outputs.v }}.zip
          body_path: release-notes.md

      - name: Publish verified update metadata after the release exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_update_manifest.py --version '${{ steps.ver.outputs.v }}' --archive 'Steamy-v${{ steps.ver.outputs.v }}.zip'
