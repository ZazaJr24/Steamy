name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.2.2)'
        required: true
        default: '0.4.6'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test and build the pinned DepotDownloaderMod
        run: python tools/DepotDownloaderMod/build.py

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "v=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Steamy/Steamy.csproj
          $version = '${{ steps.ver.outputs.v }}'
          foreach ($field in @('Version', 'FileVersion', 'AssemblyVersion')) {
            if ($project.Project.PropertyGroup.$field -ne $version) { throw "Release version must match project $field" }
          }

      - name: Test release commit
        env:
          STEAMY_UI_ARTIFACTS: ${{ github.workspace }}/artifacts/ui
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test Steamy.sln -c Release --logger trx --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Steamy-release-test-evidence
          path: |
            artifacts/test-results/
            artifacts/ui/
          if-no-files-found: error

      - name: Publish self-contained
        run: |
          dotnet publish src/Steamy/Steamy.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.ver.outputs.v }} `
            -o publish

      - name: Add license files
        run: Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish/

      - name: Zip release
        run: |
          Compress-Archive -Path publish/* -DestinationPath Steamy-v${{ steps.ver.outputs.v }}.zip
          Copy-Item Steamy-v${{ steps.ver.outputs.v }}.zip Steamy-latest.zip

      - name: Archive complete source
        shell: pwsh
        run: |
          git archive --format=zip --prefix=Steamy-v${{ steps.ver.outputs.v }}-source/ HEAD -o Steamy-v${{ steps.ver.outputs.v }}-source.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash Steamy-*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content SHA256SUMS.txt

      # The release description is the CHANGELOG.md section of this version.
      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.v }}"
          $lines = @(Get-Content CHANGELOG.md -Encoding utf8)
          $header = $lines | Select-String -Pattern ("^##\s+v?" + [regex]::Escape($version) + "\b") | Select-Object -First 1
          $notes = @()
          if ($header) {
            for ($i = $header.LineNumber; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^##\s') { break }
              $notes += $lines[$i]
            }
          }
          $text = ($notes -join "`n").Trim()
          if (-not $text) { $text = "Steamy $version" }
          Set-Content -Path release-notes.md -Value $text -Encoding utf8
          Get-Content release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Steamy v${{ steps.ver.outputs.v }}
          files: |
            Steamy-v${{ steps.ver.outputs.v }}.zip
            Steamy-latest.zip
            Steamy-v${{ steps.ver.outputs.v }}-source.zip
            SHA256SUMS.txt
          body_path: release-notes.md
