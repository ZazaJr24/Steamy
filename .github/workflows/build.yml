name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.2.2)'
        required: true
        default: '0.2.6'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "v=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish self-contained
        run: |
          dotnet publish src/Steamy/Steamy.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.ver.outputs.v }} `
            -o publish

      - name: Add license files
        run: Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish/

      - name: Zip release
        run: Compress-Archive -Path publish/* -DestinationPath Steamy-v${{ steps.ver.outputs.v }}.zip

      # The release description is the CHANGELOG.md section of this version.
      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.v }}"
          $lines = @(Get-Content CHANGELOG.md -Encoding utf8)
          $header = $lines | Select-String -Pattern ("^##\s+v?" + [regex]::Escape($version) + "\b") | Select-Object -First 1
          $notes = @()
          if ($header) {
            for ($i = $header.LineNumber; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^##\s') { break }
              $notes += $lines[$i]
            }
          }
          $text = ($notes -join "`n").Trim()
          if (-not $text) { $text = "Steamy $version" }
          Set-Content -Path release-notes.md -Value $text -Encoding utf8
          Get-Content release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Steamy v${{ steps.ver.outputs.v }}
          files: Steamy-v${{ steps.ver.outputs.v }}.zip
          body_path: release-notes.md
