name: UI Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set display resolution
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Build preview harness
        run: dotnet build tools/UiPreview/UiPreview.csproj -c Release

      - name: Render dashboard
        shell: pwsh
        timeout-minutes: 6
        run: |
          $exe = Get-ChildItem tools/UiPreview/bin/Release -Recurse -Filter UiPreview.exe | Select-Object -First 1
          & $exe.FullName "$PWD/preview"
          if ($LASTEXITCODE -ne 0) { throw "Preview exited with $LASTEXITCODE" }

      - name: Capture screen
        if: always()
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force preview | Out-Null
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("$PWD/preview/screen.png")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-preview
          path: preview/
