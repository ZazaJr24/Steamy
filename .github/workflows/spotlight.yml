name: Refresh new and upcoming spotlight

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

concurrency:
  group: spotlight-feed
  cancel-in-progress: false

jobs:
  spotlight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify discovery selection
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch verified public Steam metadata
        run: python scripts/update_spotlight.py
      - name: Update the public feed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Steamy/Data/spotlight.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh new and upcoming spotlight games'
          git pull --rebase origin main
          git push origin HEAD:main
