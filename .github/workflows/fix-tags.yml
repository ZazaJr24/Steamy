name: Fix Tags
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix v0.0.6 tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting old v0.0.6 release..."
          gh release delete v0.0.6 --yes --cleanup-tag || echo "No v0.0.6 release"
          echo "Creating new v0.0.6 tag on correct commit..."
          git config user.name "ZazaJr24"
          git config user.email "kaanleon2462@gmail.com"
          git tag v0.0.6 fa02c28
          git push origin v0.0.6
