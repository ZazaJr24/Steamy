name: Fix Tags
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v0.0.3 tag via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FULL_SHA=$(git rev-parse 600f711)
          echo "Creating tag v0.0.3 -> $FULL_SHA"
          gh api repos/ZazaJr24/ResonanceTools/git/refs \
            -f ref=refs/tags/v0.0.3 \
            -f sha="$FULL_SHA"
