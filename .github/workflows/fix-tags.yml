name: Fix Tags
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v0.0.3 release targeting correct commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FULL_SHA=$(git rev-parse 600f711)
          echo "Creating release v0.0.3 -> $FULL_SHA"
          gh release create v0.0.3 \
            --title "v0.0.3" \
            --notes "Version 0.0.3" \
            --target "$FULL_SHA"
